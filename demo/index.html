<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка page-preview</title>
<script type="module" src="../src/page-preview.js"></script>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; max-width: 760px; }
  section { margin-block: 28px; }
  page-preview { margin-block: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button, select { font: inherit; padding: 4px 10px; }
  code { background: rgb(127 127 127 / 0.15); padding: 1px 4px; border-radius: 4px; }
</style>

<h1>Проверка <code>&lt;page-preview&gt;</code></h1>

<section>
  <h2>Два экземпляра</h2>
  <page-preview id="first" src="./example.html"></page-preview>
  <page-preview src="./missing.html"></page-preview>
</section>

<section>
  <h2>Ручные проверки для первого экземпляра</h2>
  <div class="controls">
    <select id="page">
      <option value="./example.html">example.html</option>
      <option value="./pages/other.html">pages/other.html</option>
      <option value="./pages/none.html">pages/none.html (нет title и h1)</option>
      <option value="./pages/empty.html">pages/empty.html (пустые title и h1)</option>
      <option value="./pages/tricky.html">pages/tricky.html (разметка в тексте)</option>
      <option value="./missing.html">missing.html (404)</option>
    </select>
    <button id="apply">Сменить src</button>
    <button id="race">Быстрое переключение</button>
    <button id="toggle">Удалить / вернуть</button>
    <button id="nosrc">Убрать src</button>
  </div>
  <p>Быстрое переключение и задержка <code>?delay=</code> работают с
    <code>node scripts/serve.mjs</code>; обычный <code>python -m http.server</code>
    параметр задержки игнорирует.</p>
</section>

<script type="module">
  const first = document.getElementById('first');
  const placeholder = document.createComment('page-preview');
  const page = document.getElementById('page');

  document.getElementById('apply').onclick = () => { first.src = page.value; };
  document.getElementById('nosrc').onclick = () => first.removeAttribute('src');
  document.getElementById('race').onclick = () => {
    first.src = './pages/other.html?delay=1500'; // медленный, устаревший ответ
    first.src = './example.html?delay=100'; // актуальный ответ
  };
  document.getElementById('toggle').onclick = () => {
    if (first.isConnected) first.replaceWith(placeholder);
    else placeholder.replaceWith(first);
  };
</script>
</html>
